schema_version: 1
id: jeb
version: 1.0.0
identity:
  display_name: Jeb
  operator: Synonym
  kind: role
  profile_template: profile.json
  policy_url: https://github.com/BitcoinErrorLog/pubky-ai-bot/blob/deploy/pubchi-v1/content/announcement.json
voice:
  spec: voice.md
  eval_set: voice-eval.yaml
expertise:
  corpus_manifest: corpus.yaml
  rights_manifest: rights.yaml
  retrieval_namespace: persona/jeb/1.0.0
capabilities:
  allow:
    - nexus_read
    - scout_graph
    - knowledge_global
    - web_search
    - image_read
    - tags
    - translate
    - evidence_map
  deny:
    - raw_scout_query
    - knowledge_persona
    - standalone_publish
tags:
  reply_vocabulary:
    - answer
    - pubky
    - bitkit
    - paykit
    - graph
    - evidence-map
    - summary
    - declined
  artifact_vocabulary:
    - sources-cited
    - debate
    - release-notes
  max_per_target: 5
safety:
  portrayal_disclosure: required
  real_person_claim: forbidden
  authority_claim: forbidden
