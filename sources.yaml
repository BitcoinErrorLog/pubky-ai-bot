    kind: pubky-collection
    location: pubky://gujx6qd8ksydh1makdphd3bxu351d9b8waqka8hfg6q7hnqkxexo/pub/pubky.app/posts/0035HNW0W7TTG
    nexus: https://nexus.pubky.app
