  - id: pubky-knowledge-base
    product: pubky
    component: knowledge-base
    kind: git
    location: https://github.com/BitcoinErrorLog/pubky-knowledge-base
    ref: main
    # HEAD dba64d3a2221edf8033a3e153a45a27a93ba87ab
    # No verified GitHub Pages/Quartz site for this fork; cite GitHub blob on main.
    cite_base: https://github.com/BitcoinErrorLog/pubky-knowledge-base/blob/main
    include: ["**/*.md"]
    exclude:
      - "blog-draft-*"
      - "quartz/**"
      - "personas/**"
      - "Explore/Technologies/PubkyNoise.md"
      - "Explore/Technologies/Paykit.md"
    status: canonical
    audience: user
    confidentiality: public
    owner: synonym

  # Superseded by synonym-articles-collection (Pubky collection post).
  - id: synonym-articles-pubky
    product: pubky
    component: articles
    kind: local
    enabled: false
    location: /Volumes/vibedrive/vibes-dev/Synonym/articles/pubky
    cite_base: https://synonym.to/articles/pubky
    include: ["*.md"]
    exclude:
      - "*plan*"
      - "*master-plan*"
      - "*claim-chart*"
      - "*review-packet*"
      - "*source-notes*"
      - "*prior-art*"
    status: opinion
    audience: user
    confidentiality: public
    owner: synonym

  # Superseded by synonym-articles-collection (Pubky collection post).
  - id: synonym-articles-root
    product: pubky
