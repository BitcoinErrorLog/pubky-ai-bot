    include: ["README.md", "docs/**"]
    exclude: []
    status: canonical
    audience: developer
    confidentiality: public
    owner: pubky

  # The marketplace indexer moved from the frozen BitcoinErrorLog/pubky-nexus
  # fork to pubky/marketplace-nexus; the id is kept so documents are replaced.
  - id: pubky-nexus-marketplace-fork
    product: pubky-nexus
    component: marketplace-fork
    kind: git
    location: https://github.com/pubky/marketplace-nexus
