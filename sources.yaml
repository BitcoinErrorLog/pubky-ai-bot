# Public knowledge sources for Jeb. Git entries are shallow-cloned at ingest
# (no /Volumes paths in the production container). Local article trees stay
# local; if the path is missing, ingest skips them with a warning. Published
# article URLs are a follow-up (not in this manifest).
#
# `ref` is the default-branch name. Ingest records the cloned commit SHA as
# the document version. SHAs below were HEAD of that branch when this file
# was last updated.
#
# Operator articles are ingested as `kind: pubky-collection` (Nexus). Local
# synonym-articles-* trees are kept in the file but disabled.

sources:
  # pubky/pubky-core was renamed to pubky/pubky-homeserver; the id is kept so
  # existing documents are replaced in place.
  - id: pubky-core-docs
    product: pubky-core
    component: docs
    kind: git
    location: https://github.com/pubky/pubky-homeserver
    ref: main
    # HEAD 3631a05725581f154b23cdfbaf36b1ef1665005f
    cite_base: https://github.com/pubky/pubky-homeserver/blob/main
    include: ["README.md", "docs/**"]
    exclude: ["**/mdbook/**", "**/.git/**"]
    status: canonical
    audience: developer
    confidentiality: public
    owner: pubky

  # pubky/pubky-app-specs was renamed to pubky/pubky-social-specs; main still
  # carries the released 0.8.x format that Pubky App uses.
  - id: pubky-app-specs
    product: pubky-app-specs
    component: spec
    kind: git
    location: https://github.com/pubky/pubky-social-specs
    ref: main
    # HEAD 86a561e8485b3a0525661c7fb52ba72f5c17b70e
    cite_base: https://github.com/pubky/pubky-social-specs/blob/main
    include: ["SPEC.md", "docs/**", "README.md"]
    exclude: []
    status: canonical
    audience: developer
    confidentiality: public
    owner: pubky

  - id: pubky-nexus-docs
    product: pubky-nexus
    component: docs
    kind: git
    location: https://github.com/pubky/pubky-nexus
    ref: main
    # HEAD 9e20cbff89f629c31f72b137dae6754e4485e755
