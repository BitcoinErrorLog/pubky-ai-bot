# Public knowledge sources for Jeb. Git entries are shallow-cloned at ingest
# (no /Volumes paths in the production container). Local article trees stay
# local; if the path is missing, ingest skips them with a warning. Published
# article URLs are a follow-up (not in this manifest).
#
# `ref` is the default-branch name. Ingest records the cloned commit SHA as
# the document version. SHAs below were HEAD of that branch when this file
# was last updated.
#
# Operator articles are ingested as `kind: pubky-collection` (Nexus). Local
# synonym-articles-* trees are kept in the file but disabled.

sources:
  - id: pubky-core-docs
    product: pubky-core
    component: docs
    kind: git
    location: https://github.com/pubky/pubky-core
    ref: main
    # HEAD a6daa0d891167ec943f84f679faefbba424fb4bc
    cite_base: https://github.com/pubky/pubky-core/blob/main
    include: ["README.md", "docs/**"]
    exclude: ["**/mdbook/**", "**/.git/**"]
    status: canonical
    audience: developer
    confidentiality: public
    owner: pubky

  - id: pubky-app-specs
    product: pubky-app-specs
    component: spec
    kind: git
    location: https://github.com/pubky/pubky-app-specs
    ref: main
    # HEAD 3eebe18c8fa6f72377f655927069656882b2c2f9
    cite_base: https://github.com/pubky/pubky-app-specs/blob/main
    include: ["SPEC.md", "docs/**", "README.md"]
    exclude: []
    status: canonical
    audience: developer
    confidentiality: public
    owner: pubky

  - id: pubky-nexus-docs
    product: pubky-nexus
    component: docs
    kind: git
    location: https://github.com/pubky/pubky-nexus
    ref: main
    # HEAD 9e20cbff89f629c31f72b137dae6754e4485e755
    cite_base: https://github.com/pubky/pubky-nexus/blob/main
    include: ["README.md", "docs/**"]
    exclude: []
    status: canonical
    audience: developer
    confidentiality: public
    owner: pubky

  - id: pubky-app-docs
    product: pubky-app
    component: docs
    kind: git
    location: https://github.com/pubky/pubky-app
    ref: dev
    # HEAD f842705129d35cdfa45a55f86b40930e4a92d5ad
    cite_base: https://github.com/pubky/pubky-app/blob/dev
    include: ["README.md", "docs/**"]
    exclude: ["docs/adr/**"]
    status: canonical
    audience: developer
    confidentiality: public
    owner: pubky

  - id: pubky-knowledge-base
    product: pubky
    component: knowledge-base
    kind: git
    location: https://github.com/pubky/pubky-knowledge-base
    ref: main
    # HEAD 8450c03c70e81e884b0ddbc1dba48db8023ca654
    cite_base: https://pubky.org
    include: ["**/*.md"]
    exclude: ["blog-draft-*", "quartz/**"]
    status: canonical
    audience: user
    confidentiality: public
    owner: synonym

  # Superseded by synonym-articles-collection (Pubky collection post).
  - id: synonym-articles-pubky
    product: pubky
    component: articles
    kind: local
    enabled: false
    location: /Volumes/vibedrive/vibes-dev/Synonym/articles/pubky
    cite_base: https://synonym.to/articles/pubky
    include: ["*.md"]
    exclude:
      - "*plan*"
      - "*master-plan*"
      - "*claim-chart*"
      - "*review-packet*"
      - "*source-notes*"
      - "*prior-art*"
    status: opinion
    audience: user
    confidentiality: public
    owner: synonym

  # Superseded by synonym-articles-collection (Pubky collection post).
  - id: synonym-articles-root
    product: pubky
    component: articles
    kind: local
    enabled: false
    location: /Volumes/vibedrive/vibes-dev/Synonym/articles
    cite_base: https://synonym.to/articles
    include: ["*.md"]
    exclude:
      - "*plan*"
      - "*master-plan*"
      - "*claim-chart*"
      - "*review-packet*"
      - "*source-notes*"
      - "*prior-art*"
    status: opinion
    audience: user
    confidentiality: public
    owner: synonym

  - id: synonym-articles-collection
    product: pubky
