    product: pubky-app
    component: docs
    kind: git
    location: https://github.com/pubky/pubky-app
    ref: dev
    # HEAD f842705129d35cdfa45a55f86b40930e4a92d5ad
    cite_base: https://github.com/pubky/pubky-app/blob/dev
