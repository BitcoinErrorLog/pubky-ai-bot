[build]
# Legacy/dev reference only. New Railway services cannot use this file as the
# service config, and Railway IaC does not expose Docker --target. Set
# dockerfilePath to Dockerfile.pubchi in the service IaC.
dockerfilePath = "Dockerfile.pubchi"

[deploy]
startCommand = "node dist/main.js --role pubchi"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
