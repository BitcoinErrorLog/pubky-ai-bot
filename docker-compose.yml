services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jeb
      POSTGRES_DB: jeb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeb"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build: .
    command: ["--role", "ingest"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jeb@postgres:5432/jeb
      JEB_NEXUS_URL: ${JEB_NEXUS_URL:-https://nexus.staging.pubky.app}
      JEB_BOT_PK: ${JEB_BOT_PK}
      JEB_POLL_MS: ${JEB_POLL_MS:-10000}

  reason:
    build: .
    command: ["--role", "reason"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jeb@postgres:5432/jeb
      JEB_NEXUS_URL: ${JEB_NEXUS_URL:-https://nexus.staging.pubky.app}
      JEB_BOT_PK: ${JEB_BOT_PK}
      JEB_MODEL: ${JEB_MODEL:-gpt-4o-mini}
      JEB_MODEL_API_KEY: ${JEB_MODEL_API_KEY:-}
      JEB_MODEL_BASE_URL: ${JEB_MODEL_BASE_URL:-}
      JEB_CANNED_REPLY: ${JEB_CANNED_REPLY:-}
      JEB_ADMIN_PORT: "3001"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}

  publish:
    build: .
    command: ["--role", "publish"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jeb@postgres:5432/jeb
      JEB_HOMESERVER: ${JEB_HOMESERVER:-}
      JEB_SIGNUP_TOKEN: ${JEB_SIGNUP_TOKEN:-}
      JEB_TESTNET: ${JEB_TESTNET:-0}
      JEB_BOT_PK: ${JEB_BOT_PK}
      PUBKY_BOT_SECRET_KEY_HEX: ${PUBKY_BOT_SECRET_KEY_HEX:-}
      PUBKY_BOT_MNEMONIC: ${PUBKY_BOT_MNEMONIC:-}
