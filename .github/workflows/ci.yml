name: CI

on:
  push:
    branches:
      - deploy/pubchi-v1
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jeb_vitest
      JEB_KNOWLEDGE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jeb_knowledge_unit
      npm_config_onnxruntime_node_install_cuda: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Build
        run: npm run build

      - name: Create knowledge test database
        run: >-
          node -e "import('pg').then(async ({ default: pg }) => {
            const c = new pg.Client('postgres://postgres:postgres@127.0.0.1:5432/postgres');
            await c.connect();
            await c.query('CREATE DATABASE jeb_knowledge_unit');
            await c.end();
          })"

      - name: Unit and integration tests
        run: npx vitest run --exclude tests/eval/retrieval-gate.test.ts && npm run test:docker
