questions:
  - id: arch-001
    category: pubky-architecture-identity
    question: "What does the Pubky Architecture Overview page say the identity layer is based on, including Ed25519 key pairs and z-base-32?"
    expected_claims:
      - Cryptographic identity based on Ed25519 key pairs
      - Public key becomes permanent identity z-base-32 encoded
    required_sources:
      - Architecture.md
    forbidden_claims:
      - Identity is a username assigned by Synonym
    unknown_is_correct: false
    status_label: current
    notes: Architecture identity layer.
  - id: arch-002
    category: pubky-architecture-identity
    question: What does Pubky Ring do in the identity layer?
    expected_claims:
      - Pubky Ring is the mobile app for secure key management
    required_sources:
      - Architecture.md
      - Pubky Ring.md
    forbidden_claims:
      - Ring is a homeserver
    unknown_is_correct: false
    status_label: current
    notes: Ring vs homeserver mixup.
