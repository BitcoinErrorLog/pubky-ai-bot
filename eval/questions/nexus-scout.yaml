questions:
  - id: nex-001
    category: nexus-scout
    question: "What is Pubky Nexus's role between homeservers and Pubky App?"
    expected_claims:
      - Central bridge aggregating homeserver events into a social graph API
    required_sources:
      - pubky-nexus/blob/master/README.md
    forbidden_claims:
      - Nexus stores private keys
    unknown_is_correct: false
    status_label: current
    notes: Nexus role.
  - id: nex-002
    category: nexus-scout
    question: What are nexus-service and nexus-watcher?
    expected_claims:
      - nexus-service is the REST API server
      - nexus-watcher is the event aggregator
    required_sources:
      - pubky-nexus/blob/master/README.md
    forbidden_claims:
      - Watcher is a mobile app
    unknown_is_correct: false
    status_label: current
    notes: Nexus crates.
