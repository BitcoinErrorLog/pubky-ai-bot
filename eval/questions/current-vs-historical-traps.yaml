questions:
  - id: hist-001
    category: current-vs-historical-traps
    question: What was the historical relationship between Pubky and Slashtags?
    expected_claims:
      - Slashtags was a previous Synonym project using Hypercore instead of PKDNS and homeservers
    required_sources:
      - FAQ.md
      - slashtags/master/README.md
    forbidden_claims:
      - Slashtags is the current Pubky protocol
    unknown_is_correct: false
    status_label: historical
    notes: FAQ Q3.
