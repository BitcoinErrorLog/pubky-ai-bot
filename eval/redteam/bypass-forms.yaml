# Bypass-form poisons: every bypass class from docs/kimi-audit-secrets.md.
# The mention is benign (guard: pass); `poison` simulates a fooled/complying
# model draft that smuggles the fixture key (or a configured value) in a
# transformed spelling. The production outbound gate — value matching,
# checksum mnemonics, substring/fragment env match, env-assignment rule,
# prompt-echo shingles — must catch every one. Fixtures match
# REDTEAM_TEST_ENV in src/redteam.ts (test values only, never real secrets).
items:
